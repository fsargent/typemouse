# Builds TypeMouse.app, publishes a GitHub release, and updates the Homebrew tap
# when a version tag is pushed.
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build universal app
        env:
          TYPEMOUSE_SIGN_IDENTITY: "-"
          DEST: ${{ runner.temp }}/dist
          UNIVERSAL: "1"
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh

      - name: Zip the app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP/dist"
          ditto -c -k --keepParent TypeMouse.app "TypeMouse-$VERSION.zip"
          shasum -a 256 "TypeMouse-$VERSION.zip" | tee "TypeMouse-$VERSION.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/dist/TypeMouse-$VERSION.zip" \
            "$RUNNER_TEMP/dist/TypeMouse-$VERSION.zip.sha256" \
            --title "TypeMouse $VERSION" --generate-notes

      - name: Update the Homebrew tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TAP_DEPLOY_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set. The Homebrew tap was not updated."
            exit 0
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(awk '{print $1}' "$RUNNER_TEMP/dist/TypeMouse-$VERSION.zip.sha256")
          KEY="$RUNNER_TEMP/tap_key"
          (umask 077 && printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY")
          export GIT_SSH_COMMAND="ssh -i $KEY -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:fsargent/homebrew-tap.git "$RUNNER_TEMP/tap"
          cd "$RUNNER_TEMP/tap"
          sed -i '' "s/^  version \".*\"$/  version \"$VERSION\"/; s/^  sha256 \".*\"$/  sha256 \"$SHA\"/" Casks/typemouse.rb
          if git diff --quiet; then
            echo "The cask is already on $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "feat: update typemouse to $VERSION"
          git push
          rm -f "$KEY"

