# Builds TypeMouse.app and publishes a GitHub release when a version tag is pushed.
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run unit tests
        run: swift test

      - name: Build universal app
        env:
          TYPEMOUSE_SIGN_IDENTITY: "-"
          DEST: ${{ runner.temp }}/dist
          UNIVERSAL: "1"
        run: VERSION="${GITHUB_REF_NAME#v}" scripts/build-app.sh

      - name: Zip the app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd "$RUNNER_TEMP/dist"
          ditto -c -k --keepParent TypeMouse.app "TypeMouse-$VERSION.zip"
          shasum -a 256 "TypeMouse-$VERSION.zip" | tee "TypeMouse-$VERSION.zip.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/dist/TypeMouse-$VERSION.zip" \
            "$RUNNER_TEMP/dist/TypeMouse-$VERSION.zip.sha256" \
            --title "TypeMouse $VERSION" --generate-notes
